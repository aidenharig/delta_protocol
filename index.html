<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="color-scheme" content="light dark" />
  <title>Week 1 Reconditioning</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --card: #ffffff;
      --text: #17191d;
      --muted: #6b7280;
      --border: #d9dde4;
      --accent: #2563eb;
      --accent-bg: #eaf1ff;
      --success: #16a34a;
      --shadow: 0 1px 2px rgba(0,0,0,.05);
      --radius: 14px;
      --tap: 46px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --panel: #171a20;
        --card: #1b1f26;
        --text: #f3f4f6;
        --muted: #a5acb8;
        --border: #303641;
        --accent: #7aa2ff;
        --accent-bg: #202c47;
        --success: #4ade80;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .eyebrow {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .summary {
      margin-top: 3px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.35;
    }

    .reset {
      min-height: var(--tap);
      flex: 0 0 auto;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--panel);
      border-radius: 11px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .days-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin: 0 -2px 14px;
      padding: 0 2px 2px;
    }

    .days-wrap::-webkit-scrollbar { display: none; }

    .days {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .day-btn {
      min-height: var(--tap);
      min-width: 58px;
      padding: 0 15px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .day-btn.active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .callout {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .callout-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .callout-text {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .callout strong { color: var(--text); }

    .section {
      margin-bottom: 18px;
    }

    .section-label {
      margin: 0 2px 8px;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 900;
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .exercise {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
      box-shadow: var(--shadow);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .exercise-row {
      display: grid;
      grid-template-columns: 30px minmax(0,1fr);
      gap: 9px;
      align-items: start;
    }

    .exercise input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 1px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .exercise-name {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 800;
    }

    .details {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .exercise.done .exercise-name {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      opacity: .58;
    }

    .exercise.done .details {
      opacity: .52;
    }

    .progress-wrap {
      margin: 0 0 14px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .18s ease;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .save-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @media (min-width: 640px) {
      .app { padding-left: 20px; padding-right: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="topbar">
      <div>
        <div class="eyebrow">Phase 1 · Week 1</div>
        <div class="summary" id="daySummary">Monday · Full Body A · 55–65 min</div>
      </div>
      <button class="reset" id="resetBtn" type="button">Reset day</button>
    </div>

    <div class="days-wrap" aria-label="Training days">
      <div class="days">
        <button class="day-btn" type="button" data-day="mon">Mon</button>
        <button class="day-btn" type="button" data-day="tue">Tue</button>
        <button class="day-btn" type="button" data-day="wed">Wed</button>
        <button class="day-btn" type="button" data-day="thu">Thu</button>
        <button class="day-btn" type="button" data-day="fri">Fri</button>
        <button class="day-btn" type="button" data-day="sat">Sat</button>
        <button class="day-btn" type="button" data-day="sun">Sun</button>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Day progress</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <section class="callout" id="coreRule">
      <div class="callout-title">Week 1 rule</div>
      <div class="callout-text">
        Lift at <strong>RPE 6–7 / 3–4 RIR</strong>. No grinding, no maxes, no extra exercises.
        Leave the gym feeling like you could have done more.
      </div>
    </section>

    <div id="session"></div>

    <div class="footer-note">
      Progress is saved automatically on this device.
      <div class="save-status"><span class="save-dot"></span><span id="saveLabel">Saved</span></div>
    </div>

    <div id="status" class="sr-only" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "fitnessOS_week1_reconditioning_v1";

      const sessions = {
        mon: {
          summary: "Monday · Full Body A · 55–65 min",
          rule: true,
          sections: [
            {
              label: "Warm-up · 11–13 min",
              items: [
                ["5 min easy cardio", "Bike, rower, elliptical, or treadmill. Just get warm."],
                ["Movement prep · 1 round", "8 bodyweight squats · 6 reverse lunges/leg · 8 glute bridges · 8 scapular push-ups · 10 band pull-aparts/light rows · 6/side lunge + rotation · 10 slow calf raises"],
                ["Squat ramp-up sets", "Empty bar × 8–10 · light × 6–8 · moderate × 4–5. These do not count as working sets."]
              ]
            },
            {
              label: "Main work · ~45 min",
              items: [
                ["Back squat", "2 × 6–10 · 3–4 RIR · rest 2–3 min"],
                ["Bench press", "2 × 6–10 · 3–4 RIR · rest 2–3 min"],
                ["Romanian deadlift", "2 × 8–10 · 3–4 RIR · rest 2 min"],
                ["Chest-supported row", "2 × 8–12 · ~3 RIR · rest 90 sec"],
                ["Standing calf raise", "2 × 10–15 · controlled stretch · rest 60–90 sec"],
                ["Pallof press OR dead bug", "Pallof: 2 × 8–12/side · OR dead bug: 2 × 6–10/side"]
              ]
            },
            {
              label: "Finish",
              items: [["Optional 2–3 min walk", "Then leave. No finisher."]]
            }
          ]
        },

        tue: {
          summary: "Tuesday · Easy Aerobic + Mobility · 30–35 min",
          rule: false,
          sections: [
            {
              label: "Aerobic base",
              items: [
                ["5 min easy warm-up", "Low-impact cardio."],
                ["25 min easy aerobic", "Incline treadmill, bike, elliptical, or similar · RPE ~3/10 · full-sentence talk test"]
              ]
            },
            {
              label: "Mobility · ~5 min",
              items: [
                ["Calf stretch", "~30 sec/side"],
                ["Ankle dorsiflexion rocks", "8–10/side"],
                ["Hip-flexor stretch", "~30 sec/side"],
                ["90/90 hip rotations", "6/side"],
                ["Thoracic rotations", "6/side"]
              ]
            }
          ]
        },

        wed: {
          summary: "Wednesday · Full Body B · 55–65 min",
          rule: true,
          sections: [
            {
              label: "Warm-up · ~10 min",
              items: [
                ["5 min easy cardio", "Get warm, do not fatigue yourself."],
                ["Movement prep · 1 round", "8 bodyweight squats · 6 reverse lunges/leg · 8 glute bridges · 10 band rows/pull-aparts · 6 dead bugs/side"],
                ["Deadlift ramp-up sets", "Use several easy progressive sets before working weight."]
              ]
            },
            {
              label: "Main work",
              items: [
                ["Trap-bar deadlift", "2 × 5–8 · 3–4 RIR · rest 2–3 min"],
                ["Incline dumbbell press", "2 × 8–12 · 3–4 RIR · rest ~2 min"],
                ["Rear-foot-elevated split squat", "2 × 8/leg · conservative loading"],
                ["Lat pulldown", "2 × 8–12 · controlled"],
                ["Landmine OR DB overhead press", "2 × 8–12"],
                ["Tibialis raise", "2 × 12–20"],
                ["Side plank", "2 × 20–40 sec/side"]
              ]
            }
          ]
        },

        thu: {
          summary: "Thursday · Run/Walk + Mobility · 30–35 min",
          rule: false,
          sections: [
            {
              label: "Warm-up · ~6 min",
              items: [
                ["Walk", "5 min easy"],
                ["Quick prep", "8 ankle rocks/side · 10 calf raises · 8 leg swings/side · 5 walking lunges/side"]
              ]
            },
            {
              label: "Run / walk",
              items: [
                ["6 rounds", "1 min VERY easy jog + 2 min walk · only 6 total running minutes"],
                ["Cool-down walk", "5 min easy"]
              ]
            },
            {
              label: "Key rule",
              items: [["Pace does not matter", "Jog almost embarrassingly slow. This is tissue conditioning, not a fitness test."]]
            }
          ]
        },

        fri: {
          summary: "Friday · Full Body C · 55–65 min",
          rule: true,
          sections: [
            {
              label: "Warm-up · ~10 min",
              items: [
                ["5 min easy cardio", "Get warm."],
                ["Movement prep · 1 round", "8 bodyweight squats · 6 reverse lunges/leg · 8 glute bridges · 8 scapular push-ups · 10 light rows · 10 calf raises"],
                ["Front squat ramp-up sets", "Several easy progressive sets before working weight."]
              ]
            },
            {
              label: "Main work",
              items: [
                ["Front squat", "2 × 8–10 · 3–4 RIR. If awkward, use leg press 2 × 10–12."],
                ["Dumbbell bench press", "2 × 8–12 · 3–4 RIR"],
                ["Hamstring curl", "2 × 10–15"],
                ["Seated cable row", "2 × 8–12"],
                ["Farmer carry", "2–3 × 30–40 m · moderate load · tall posture"],
                ["Standing calf raise", "2 × 10–15"],
                ["Tibialis raise", "2 × 12–20"]
              ]
            },
            {
              label: "Finish",
              items: [["Stop here", "No Friday pump finisher."]]
            }
          ]
        },

        sat: {
          summary: "Saturday · Complete Rest / Social",
          rule: false,
          sections: [
            {
              label: "Recovery",
              items: [["Rest day", "No required training. Eat normally, hydrate, and protect recovery where practical."]]
            }
          ]
        },

        sun: {
          summary: "Sunday · Recovery",
          rule: false,
          sections: [
            {
              label: "Optional",
              items: [["Easy walk", "20–45 min only if it feels restorative. Otherwise take the day fully off."]]
            }
          ]
        }
      };

      const dayMap = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

      const defaultState = () => ({
        currentDay: dayMap[new Date().getDay()] || "mon",
        completed: {}
      });

      let state = loadState();

      const sessionEl = document.getElementById("session");
      const summaryEl = document.getElementById("daySummary");
      const coreRuleEl = document.getElementById("coreRule");
      const statusEl = document.getElementById("status");
      const progressTextEl = document.getElementById("progressText");
      const progressBarEl = document.getElementById("progressBar");
      const saveLabelEl = document.getElementById("saveLabel");

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();

          const parsed = JSON.parse(raw);
          return {
            currentDay: sessions[parsed.currentDay] ? parsed.currentDay : defaultState().currentDay,
            completed: parsed.completed && typeof parsed.completed === "object" ? parsed.completed : {}
          };
        } catch {
          return defaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          saveLabelEl.textContent = "Saved";
        } catch {
          saveLabelEl.textContent = "Could not save";
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function itemKey(day, sectionIndex, itemIndex) {
        return `${day}-${sectionIndex}-${itemIndex}`;
      }

      function currentKeys() {
        const keys = [];
        sessions[state.currentDay].sections.forEach((section, si) => {
          section.items.forEach((_, ii) => keys.push(itemKey(state.currentDay, si, ii)));
        });
        return keys;
      }

      function updateProgress() {
        const keys = currentKeys();
        const done = keys.filter(k => !!state.completed[k]).length;
        const total = keys.length;
        const pct = total ? (done / total) * 100 : 0;

        progressTextEl.textContent = `${done} / ${total}`;
        progressBarEl.style.width = `${pct}%`;
      }

      function render() {
        const data = sessions[state.currentDay];

        summaryEl.textContent = data.summary;
        coreRuleEl.style.display = data.rule ? "block" : "none";

        document.querySelectorAll(".day-btn").forEach(btn => {
          const active = btn.dataset.day === state.currentDay;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });

        sessionEl.innerHTML = "";

        data.sections.forEach((section, si) => {
          const sectionNode = document.createElement("section");
          sectionNode.className = "section";

          const heading = document.createElement("div");
          heading.className = "section-label";
          heading.textContent = section.label;
          sectionNode.appendChild(heading);

          const stack = document.createElement("div");
          stack.className = "stack";

          section.items.forEach((item, ii) => {
            const key = itemKey(state.currentDay, si, ii);
            const checked = !!state.completed[key];

            const label = document.createElement("label");
            label.className = `exercise${checked ? " done" : ""}`;

            label.innerHTML = `
              <div class="exercise-row">
                <input
                  type="checkbox"
                  ${checked ? "checked" : ""}
                  aria-label="Mark ${escapeHtml(item[0])} complete"
                />
                <div>
                  <div class="exercise-name">${escapeHtml(item[0])}</div>
                  <div class="details">${escapeHtml(item[1])}</div>
                </div>
              </div>
            `;

            const checkbox = label.querySelector('input[type="checkbox"]');
            checkbox.addEventListener("change", () => {
              state.completed[key] = checkbox.checked;
              label.classList.toggle("done", checkbox.checked);
              saveState();
              updateProgress();
              statusEl.textContent = `${item[0]} ${checkbox.checked ? "completed" : "unchecked"}`;
            });

            stack.appendChild(label);
          });

          sectionNode.appendChild(stack);
          sessionEl.appendChild(sectionNode);
        });

        updateProgress();
      }

      document.querySelectorAll(".day-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currentDay = btn.dataset.day;
          saveState();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        const keys = currentKeys();
        const completedCount = keys.filter(k => !!state.completed[k]).length;

        if (completedCount > 0) {
          const confirmed = window.confirm("Reset all checkboxes for this day?");
          if (!confirmed) return;
        }

        keys.forEach(k => delete state.completed[k]);
        saveState();
        render();
        statusEl.textContent = "Current day reset";
      });

      window.addEventListener("pagehide", saveState);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveState();
      });

      render();
      saveState();
    })();
  </script>
</body>
</html>
